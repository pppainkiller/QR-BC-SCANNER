<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POS Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { border-radius: 0 !important; box-sizing: border-box; }
    body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header { padding: 15px; text-align: center; background: #002b49; font-size: 18px; font-weight: bold; border-bottom: 2px solid #00a8e8; display: flex; justify-content: space-between; align-items: center;}
    .close-btn { background: #c8102e; color: white; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; }
    #reader { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; }
    #reader video { object-fit: cover; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="header">
    <span>Scanner Active</span>
    <button class="close-btn" onclick="window.close()">Cancel</button>
  </div>
  <div id="reader"></div>
  <script>
    const html5QrCode = new Html5Qrcode("reader");
    let scanned = false;

    const config = {
      fps: 20,
      disableFlip: true,
      qrbox: function(vw, vh) {
        const size = Math.min(vw, vh) * 0.7;
        return { width: Math.max(size, 250), height: Math.max(size * 0.5, 150) };
      },
      videoConstraints: {
        facingMode: "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 },
        advanced: [{ focusMode: "continuous" }]
      },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.UPC_A
      ],
      // THE FIX: this MUST be nested inside experimentalFeatures, not top-level.
      // It lets the browser's native, hardware-accelerated BarcodeDetector do the
      // decoding instead of the much slower pure-JS fallback.
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };

    function onScanSuccess(decodedText) {
      if (scanned) return; // guard against duplicate fires before stop() resolves
      scanned = true;
      html5QrCode.stop().then(() => {
        if (window.opener) {
          window.opener.postMessage({ code: decodedText.trim() }, '*');
          window.close();
        } else {
          alert("Scanned: " + decodedText + "\n\nPlease close this tab manually.");
        }
      }).catch(() => {
        // even if stop() errors, still deliver the result
        if (window.opener) {
          window.opener.postMessage({ code: decodedText.trim() }, '*');
          window.close();
        }
      });
    }

    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, () => {})
      .catch(() => {
        html5QrCode.start({ facingMode: "user" }, config, onScanSuccess, () => {})
          .catch(() => alert("Camera Access Denied. Please allow camera permissions."));
      });
  </script>
</body>
</html>
